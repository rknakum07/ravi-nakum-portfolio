name: Optimize portfolio images

on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize_images.py'
      - '.github/workflows/optimize-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Generate responsive image assets
        run: python scripts/optimize_images.py
      - name: Commit optimized assets
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add img index.html
            git commit -m "Optimize responsive portfolio images without quality loss"
            git push
          else
            echo "No image or markup changes to commit."
          fi
