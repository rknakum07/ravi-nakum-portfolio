name: Optimize portfolio images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Optimize images and responsive markup
        run: python scripts/optimize_images.py
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img index.html
          if git diff --cached --quiet; then
            echo "No optimization changes to commit."
          else
            git commit -m "Optimize image assets for mobile and desktop"
            git push origin HEAD:main
          fi
